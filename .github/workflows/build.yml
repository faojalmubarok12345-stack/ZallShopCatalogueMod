name: Build SMAPI Mod

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore ZallShopCatalogueMod.csproj

      - name: Build release DLL
        run: dotnet build ZallShopCatalogueMod.csproj -c Release -o ./output

      - name: Upload built mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZallShopCatalogueMod-build
          path: ./output/
          
