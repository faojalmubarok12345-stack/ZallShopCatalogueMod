name: Build SMAPI Mod

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@main

      - name: Add reference assemblies
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-reference-assemblies@main

      - name: Build release DLL
        run: dotnet build ZallShopCatalogueMod.csproj -c Release -o ./output

      - name: Upload built mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZallShopCatalogueMod-build
          path: ./output/
          
